- key: AWS-0132:module.bootstrap:aws_s3_bucket.terraform_state_bucket
  rule_id: AWS-0132
  severity: HIGH
  verdict: real-judgment
  verdict_author: model
  rationale: |-
    `modules/bootstrap/main.tf` has no `aws_s3_bucket_server_side_encryption_configuration` at all, so the bucket relies on S3's default SSE-S3 (AWS-managed AES-256) encryption rather than a customer-managed KMS key. For a Terraform state bucket that is a real gap: SSE-S3 gives no per-request CloudTrail audit trail and no way to scope who can decrypt independently of who can read the bucket.

    Unlike AWS-0086/0087/0091/0093, this is not a single resource with flags to flip. It requires a new `aws_kms_key`, a key policy deciding who may encrypt and decrypt (in particular, whatever role runs `terraform apply` needs `kms:Decrypt` or state reads break), a rotation decision, and ongoing key cost (~$1/month plus request charges). No ADR records a decision on state-bucket encryption ownership, so there is nothing to defer to. This needs a human to choose the key policy and confirm it does not lock out the apply role, not a mechanical resource addition.
  evidence: []
  recorded_on: issue
  issue: 59
  alert: 7
  alert_state: open
- key: AWS-0164:module.vpc:aws_subnet.public_zone_1
  rule_id: AWS-0164
  severity: HIGH
  verdict: real-mechanical
  verdict_author: model
  rationale: |-
    `modules/vpc/main.tf` sets `map_public_ip_on_launch = true` on `public_zone_1`. This is redundant with today's actual behaviour: both instances placed in this subnet (`live/management/main.tf:25,81`) already set `associate_public_ip_address = true` explicitly at the instance level, which is what actually governs their public IP today, not the subnet default. The subnet flag is not a decision this architecture depends on -- it is unused given the explicit per-instance setting.

    What the flag does add is a latent gap: any future resource placed in `public_zone_1` without an explicit `associate_public_ip_address` gets a public IP by default rather than by choice. No ADR argues for that default; the architecture's public-facing design is expressed instance-by-instance (`docs/adr/0002-...`), not subnet-wide. Removing `map_public_ip_on_launch` from this resource changes no behaviour for the two instances that exist today and closes the gap for whatever is placed here next. Mechanical: delete one line, zero coordination.
  evidence:
  - docs/adr/0002-self-host-nextcloud-on-t4g-small.md
  recorded_on: issue
  issue: 60
  alert: 8
  alert_state: open
