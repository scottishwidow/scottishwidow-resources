  alert_state: open
- key: AWS-0087:module.bootstrap:aws_s3_bucket.terraform_state_bucket
  rule_id: AWS-0087
  severity: HIGH
  verdict: real-mechanical
  verdict_author: model
  rationale: |-
    Fires on the same absence as AWS-0086 (issue #48): `modules/bootstrap/main.tf` declares no `aws_s3_bucket_public_access_block` for `terraform_state_bucket` at all. `block_public_policy` is one of the four flags that resource would set; none of them is set anywhere. The bucket's `private` ACL and `BucketOwnerPreferred` ownership controls constrain what the ACL currently is, not what a bucket policy could later grant, so they do not substitute for this control.

    No ADR discusses omitting a public access block for the state bucket, and this is the bucket holding Terraform state for the `management` account -- the object whose disclosure is most useful to an attacker of anything else in this repository. The fix is the single `aws_s3_bucket_public_access_block` resource with all four flags `true`, already scoped by AWS-0086's issue; this alert and AWS-0091/AWS-0093/AWS-0094 (below threshold) resolve as the same side effect.
  evidence: []
