# SPDX-License-Identifier: MIT
#
# IaC triage, propose-only (tasks.md 4.3, design.md - Decision 10).
#
# Four tasks, and only the last one involves a model:
#
#   findings     run:  scan + normalise + partition + severity gate  (deterministic)
#   outstanding  run:  the eligible set minus what the tracker holds (deterministic)
#   corpus       run:  every first-party .tf file (ADR-0008)         (deterministic)
#   verdicts     over: outputs.outstanding.findings, one branch per finding
#
# The pipeline assigns no verdict to anything the deterministic half excluded:
# `outstanding` reads `eligible`, so vendored and below-threshold findings are
# never in a prompt. That is the ownership-then-severity order of Decision 2
# holding at the point it costs money, and the tracker exclusion is the same
# argument applied a step later: a finding already filed is judged already.
#
# Nothing here writes to alert state or to the tracker (tasks.md 4.6). A run
# produces a manifest; `collect_verdicts.py` turns that into verdict records and
# the group-6 step files them as issues. Read that as the safety property it is:
# the agent has no toolboxes at all, so there is no path from a run to a
# dismissal even if the prompt asked for one.

seclab-taskflow-agent:
  version: "1.0"
  filetype: taskflow

# Which model answers, and over which API. Without this the framework falls back
# to its Copilot default and would want a GitHub PAT; see the file itself.
model_config: security.iac_security.taskflow.model_configs.iac_triage

globals:
  # Which report to triage. A live scan by default, since triage now runs
  # automatically off a real scan; replay the committed baseline instead with:
  #   -g report=security/iac_security/fixtures/baseline-scan.json
  report: ""

  # A tracker snapshot, read on the host where `gh` and a token are. Left empty
  # the `outstanding` task runs `gh` itself, which the published image may not
  # carry -- so CI hands it a file rather than reaching for the network here.
  tracker: ""

  # Triage the whole eligible set, tracker item or not. Set only by a dispatched
  # run: it is what makes re-triaging a filed finding a deliberate act.
  bypass: "false"

taskflow:
  - task:
      name: findings
      id: findings
      must_complete: true
      env:
        TRIVY_REPORT: "{{ globals.report }}"
      run: |
        security/iac_security/taskflow/scan.sh
      # The partition's shape is a contract, not a convention: a normaliser that
      # stopped emitting `eligible` would otherwise fan out over nothing and
      # report a clean run.
      outputs:
        type: object
        properties:
          severity_threshold:
            type: string
          eligible:
            type: array
            items:
              type: object
              properties:
                key: {type: string, minLength: 1}
                rule_id: {type: string, minLength: 1}
                title: {type: string}
                severity: {type: string}
                message: {type: string}
                resolution: {type: string}
                primary_url: {type: string}
                module_address: {type: string}
                resource_address: {type: string}
                code_path: {type: string}
                start_line: {type: integer}
                triage_status: {const: eligible}
                code:
                  type: array
                  items:
                    type: object
                    properties:
                      number: {type: integer}
                      content: {type: string}
                    required: [number, content]
              required:
                - key
                - rule_id
                - severity
                - message
                - code_path
                - triage_status
          below_threshold: {type: array}
          vendored: {type: array}
          duplicate_first_party_keys: {type: array}
        required: [eligible, below_threshold, vendored, severity_threshold]

  - task:
      name: outstanding
      id: outstanding
      must_complete: true
      env:
        TRIVY_REPORT: "{{ globals.report }}"
        TRACKER_ITEMS: "{{ globals.tracker }}"
        TRIAGE_BYPASS_TRACKER: "{{ globals.bypass }}"
      # `run:` is not templated, so the report is named again through the
      # environment rather than read from `outputs.findings`. A named report is
      # replayed rather than rescanned, so the two tasks partition one report;
      # only a live local run pays for a second scan here.
      run: |
        security/iac_security/taskflow/scan.sh |
          python3 security/iac_security/taskflow/outstanding.py
      # `findings` carries whole finding records, not keys: the fan-out prompt
      # templates off them, and `collect_verdicts.py` attributes a branch that
      # produced nothing by its position in this list.
      outputs:
        type: object
        properties:
          findings:
            type: array
            items:
              type: object
              properties:
                key: {type: string, minLength: 1}
                rule_id: {type: string, minLength: 1}
                triage_status: {const: eligible}
              required: [key, rule_id, triage_status]
          excluded: {type: array}
          retriaged: {type: array}
          bypassed: {type: boolean}
        required: [findings, excluded, retriaged, bypassed]

  - task:
      name: corpus
      id: corpus
      must_complete: true
      run: |
        python3 security/iac_security/taskflow/terraform_corpus.py
      outputs:
        type: object
        properties:
          documents:
            type: array
            items:
              type: object
              properties:
                path: {type: string, minLength: 1}
                text: {type: string}
              required: [path, text]
          missing_dirs: {type: array}
        required: [documents]

  - task:
      name: verdicts
      id: verdicts
      repeat_prompt: true
      # The logical name from `model_configs/iac_triage.yaml`, not a provider
      # model ID. It is named here because a task with no `model:` falls back to
      # the framework's DEFAULT_MODEL -- `gpt-4.1` -- which is not in that file's
      # `models:` map and would be passed through to Anthropic verbatim.
      model: triage
      over: outputs.outstanding.findings
      agents:
        - security.iac_security.taskflow.personalities.iac_triage
      # The verdict is the agent's answer, not a tool result -- it calls no
      # tools -- so what gets captured is the response text.
      capture: response
      # A liveness check, deliberately, and not a shape check.
      #
      # This schema used to describe the verdict object, and it could not hold:
      # the framework decodes a captured response with a bare `json.loads`, so a
      # model that wraps its JSON in a markdown fence -- which Sonnet does, on
      # every run -- produced a string, failed this schema, and had its branch
      # recorded as `result: null`. The verdict was not merely rejected but
      # destroyed, leaving `collect_verdicts.py` unable to say what had been
      # discarded or why, which is precisely the record `tasks.md` 4.5 promises.
      #
      # A schema on a prose channel cannot tell a formatting slip from a
      # refusal. So it checks the one thing it can -- that the branch produced
      # something at all -- and the shape is checked in `collect_verdicts.py`,
      # where the text survives to be reported.
      outputs:
        type: string
        minLength: 1
      # The corpus comes first and the finding last, and both orderings are
      # deliberate. A cache prefix must be common to every branch, and the
      # personality plus the corpus is the whole of what every branch shares --
      # put the per-finding text first and each branch diverges before the
      # corpus begins, so the corpus is paid for once per finding rather than
      # once. It is also the better prompt: the model answers about the last
      # thing it read, which should be the finding it is being asked about.
      user_prompt: |
        The repository's Terraform corpus follows: every first-party `.tf` file,
        complete and exhaustive. Cite by path any files you rely on.
        {% for doc in outputs.corpus.documents %}
        ===== {{ doc.path }} =====
        {{ doc.text }}
        {% endfor %}

        Triage this finding.

        Finding key: {{ result.key }}
        Rule: {{ result.rule_id }} — {{ result.title }}
        Severity: {{ result.severity }}
        What the scanner reports: {{ result.message }}
        The scanner's suggested resolution: {{ result.resolution }}
        Rule documentation: {{ result.primary_url }}

        Where it is:
          file: {{ result.code_path }} (line {{ result.start_line }})
          module: {{ result.module_address }}
          resource: {{ result.resource_address }}

        The code it fired on:
        {% for line in result.code %}
        {{ line.number }}: {{ line.content }}
        {%- endfor %}

        Reply with the JSON object described in your task, and nothing else.
