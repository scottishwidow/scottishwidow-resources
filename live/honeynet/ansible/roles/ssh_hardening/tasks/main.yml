---
- name: Wait for cloud-init to finish
  ansible.builtin.command:
    cmd: cloud-init status --wait
  changed_when: false
  check_mode: false
  failed_when: false

- name: Write the SSH hardening config
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH

- name: Remove the host keys that are not Ed25519
  ansible.builtin.file:
    path: "/etc/ssh/ssh_host_{{ item.0 }}_key{{ item.1 }}"
    state: absent
  loop: "{{ ['rsa', 'ecdsa', 'dsa'] | product(['', '.pub']) | list }}"
  notify: Restart SSH
