[defaults]
inventory = ./inventory/hosts.json

roles_path = ./roles

remote_user = root

private_key_file = ~/.ssh/hetzner

result_format = yaml

retry_files_enabled = False

interpreter_python = auto_silent

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=.known_hosts
