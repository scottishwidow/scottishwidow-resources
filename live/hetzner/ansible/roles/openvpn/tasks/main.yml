---
# cloud-init on the Gateway can end in status "error" while user data still
# applies, so the checks below verify the result instead of the exit code.
- name: Wait for cloud-init to finish
  ansible.builtin.command:
    cmd: cloud-init status --wait
  changed_when: false
  check_mode: false
  failed_when: false

- name: Read IPv4 forwarding
  ansible.builtin.command:
    cmd: sysctl -n net.ipv4.ip_forward
  register: openvpn_ip_forward
  changed_when: false
  check_mode: false

- name: Read the NAT chain
  ansible.builtin.command:
    cmd: nft list chain ip nat postrouting
  register: openvpn_nat_chain
  changed_when: false
  check_mode: false
  failed_when: false

- name: Require forwarding and NAT from the Gateway user data
  ansible.builtin.assert:
    that:
      - openvpn_ip_forward.stdout == "1"
      - openvpn_nat_chain.rc == 0
    fail_msg: IPv4 forwarding or nftables NAT is missing. They belong to the Gateway user data in live/hetzner/openvpn, not to this role.

- name: Install OpenVPN and Easy-RSA
  ansible.builtin.apt:
    name:
      - openvpn
      - easy-rsa
    update_cache: true
    cache_valid_time: 3600

- name: Create the Easy-RSA directory
  ansible.builtin.file:
    path: "{{ openvpn_pki_dir | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Build the PKI
  environment:
    EASYRSA_BATCH: "1"
    EASYRSA_PKI: "{{ openvpn_pki_dir }}"
    EASYRSA_ALGO: ec
  block:
    - name: Initialize the PKI
      ansible.builtin.command:
        cmd: /usr/share/easy-rsa/easyrsa init-pki
        creates: "{{ openvpn_pki_dir }}/private"

    - name: Build the CA
      ansible.builtin.command:
        cmd: /usr/share/easy-rsa/easyrsa build-ca nopass
        creates: "{{ openvpn_pki_dir }}/ca.crt"
      environment:
        EASYRSA_REQ_CN: gateway-openvpn-ca

    - name: Build the server certificate
      ansible.builtin.command:
        cmd: /usr/share/easy-rsa/easyrsa build-server-full server nopass
        creates: "{{ openvpn_pki_dir }}/issued/server.crt"

    - name: Build the client certificates
      ansible.builtin.command:
        cmd: "/usr/share/easy-rsa/easyrsa build-client-full {{ item }} nopass"
        creates: "{{ openvpn_pki_dir }}/issued/{{ item }}.crt"
      loop: "{{ openvpn_clients }}"

- name: Generate the tls-crypt key
  ansible.builtin.command:
    cmd: "openvpn --genkey tls-crypt {{ openvpn_tls_crypt_key }}"
    creates: "{{ openvpn_tls_crypt_key }}"

- name: Write the server config
  ansible.builtin.template:
    src: server.conf.j2
    dest: "{{ openvpn_server_dir }}/server.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart OpenVPN

- name: Enable and start OpenVPN
  ansible.builtin.systemd_service:
    name: openvpn-server@server
    enabled: true
    state: started

- name: Read the CA certificate
  ansible.builtin.slurp:
    src: "{{ openvpn_pki_dir }}/ca.crt"
  register: openvpn_ca_cert

- name: Read the tls-crypt key
  ansible.builtin.slurp:
    src: "{{ openvpn_tls_crypt_key }}"
  register: openvpn_tls_crypt
  no_log: true

- name: Read the client certificates
  ansible.builtin.slurp:
    src: "{{ openvpn_pki_dir }}/issued/{{ item }}.crt"
  loop: "{{ openvpn_clients }}"
  register: openvpn_client_certs

- name: Read the client keys
  ansible.builtin.slurp:
    src: "{{ openvpn_pki_dir }}/private/{{ item }}.key"
  loop: "{{ openvpn_clients }}"
  register: openvpn_client_keys
  no_log: true

- name: Create the local client config directory
  ansible.builtin.file:
    path: "{{ openvpn_client_output_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost

- name: Write the client configs
  ansible.builtin.template:
    src: client.ovpn.j2
    dest: "{{ openvpn_client_output_dir }}/{{ item.0.item }}.ovpn"
    mode: "0600"
  loop: "{{ openvpn_client_certs.results | zip(openvpn_client_keys.results) | list }}"
  loop_control:
    label: "{{ item.0.item }}"
  delegate_to: localhost
  no_log: true
