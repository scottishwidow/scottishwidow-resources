---
# The verify playbook opens a Cowrie session with these credentials and runs
# this download in it. The address needs no resolver and is outside the
# Honeynet, so the Sensor sends the download to the Sinkhole, and the file
# holds the Sinkhole marker.
verify_cowrie_username: root
verify_cowrie_password: letmein
verify_cowrie_download_url: http://1.1.1.1/malware.sh

# The verify playbook also runs this download by hostname. The Sinkhole DNS
# resolves the name, and the download takes the same path as the address
# above. The file name must differ from the one above.
verify_cowrie_hostname_download_url: http://example.com/loader.sh
verify_dns_query_name: example.com
verify_dns_query_server: 8.8.8.8

# The Sinkhole answers every HTTP and HTTPS request with a body that holds
# this marker.
sinkhole_marker: honeynet-sinkhole

# The Sinkhole answers every DNS A query with this address. It is outside the
# Honeynet, so the Sensor sends a connection to it through the same DNAT as a
# literal IP. Cowrie wget refuses an address that is not globally routable, so
# a documentation range such as TEST-NET-2 cannot be used (ADR-0016).
sinkhole_dns_answer: 1.1.1.1

# A Honeypot connection to this address and port leaves the Honeynet with no
# Sinkhole on the way, so Containment drops it.
verify_internet_host: 1.1.1.1
verify_contained_port: 22

# The verify playbook offers these credentials to the OpenCanary FTP, MySQL
# and MSSQL modules. Every module refuses them and records the attempt.
verify_opencanary_username: admin
verify_opencanary_password: hunter2

# ids reads a copy of the traffic and cannot block. ips reads the queue that
# the forward chain of the Sensor user data fills, and gives a verdict on each
# packet. The verify playbook selects the Suricata checks for the mode.
suricata_mode: ids

# The local Suricata rules on the Sensor match these strings in a Cowrie Telnet
# session. One rule alerts and one rule drops. A string must not contain a
# character that a rule content must escape: ; " \ |
suricata_canary_rules:
  alert:
    sid: 1000001
    content: HONEYNET-CANARY-ALERT-4b1e9c
  drop:
    sid: 1000002
    content: HONEYNET-CANARY-DROP-7d52a0

# EveBox on the Sensor listens on this port on localhost only. The operator
# reaches it through an SSH local forward, and the verify playbook queries its
# API.
evebox_port: 5636
