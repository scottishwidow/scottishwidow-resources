---
- name: Check the host network of the Sensor and run the allowlist proxy
  hosts: sensors
  gather_facts: false

  roles:
    - sensor_network_check
    - allowlist_proxy

- name: Harden SSH on every Honeynet host
  hosts: all
  gather_facts: false

  roles:
    - ssh_hardening

# The proxy is the only outbound path of a Honeypot, so this play comes
# after the play that installs it.
- name: Run the honeypots on every Honeypot
  hosts: honeypots
  gather_facts: false

  roles:
    - honeypot_docker
    - cowrie
    - opencanary
