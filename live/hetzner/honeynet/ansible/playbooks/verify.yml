---
- name: Verify the Sensor from the workstation
  hosts: sensors
  gather_facts: false
  become: false

  vars:
    verify_ssh_key: "{{ lookup('ansible.builtin.config', 'DEFAULT_PRIVATE_KEY_FILE') | expanduser }}"
    verify_ssh: >-
      ssh -o BatchMode=yes -o ConnectTimeout=10
      -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ playbook_dir }}/../.known_hosts
      -p {{ ansible_port }}

  tasks:
    - name: Log in on the admin SSH port with the Honeynet key
      ansible.builtin.command:
        cmd: "{{ verify_ssh }} -o IdentitiesOnly=yes -i {{ verify_ssh_key | quote }} admin@{{ ansible_host }} true"
      delegate_to: localhost
      register: verify_key_login
      changed_when: false
      failed_when: false

    - name: Try a password login on the admin SSH port
      ansible.builtin.command:
        cmd: >-
          {{ verify_ssh }} -o PubkeyAuthentication=no
          -o PreferredAuthentications=password,keyboard-interactive
          admin@{{ ansible_host }} true
      delegate_to: localhost
      register: verify_password_login
      changed_when: false
      failed_when: false

    - name: Require key-only SSH on the admin port
      ansible.builtin.assert:
        that:
          - verify_key_login.rc == 0
          - verify_password_login.rc == 255
          - "'Permission denied (publickey)' in verify_password_login.stderr"
        fail_msg: >-
          key login stderr={{ verify_key_login.stderr | trim }};
          password login stderr={{ verify_password_login.stderr | trim }}

- name: Verify Cowrie and the allowlist proxy from the workstation
  hosts: sensors
  gather_facts: false

  tasks:
    - name: Read the address the workstation connects from
      ansible.builtin.shell:
        cmd: echo "$SSH_CONNECTION"
      become: false
      register: verify_ssh_connection
      changed_when: false
      check_mode: false

    - name: Keep the workstation address for the Honeypot checks
      ansible.builtin.set_fact:
        verify_workstation_ip: "{{ verify_ssh_connection.stdout.split() | first }}"

    - name: Read the Containment drop counter
      ansible.builtin.command:
        cmd: nft list chain inet filter forward
      register: verify_containment_before
      changed_when: false
      check_mode: false

    - name: Grab the Cowrie SSH banner on port 22
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        search_regex: (SSH-2.0-.*)
        timeout: 30
      delegate_to: localhost
      become: false
      register: verify_cowrie_banner
      failed_when: false

    - name: Log in to Cowrie on port 23 and download a file
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/files/cowrie_telnet_probe.py"
          - --host
          - "{{ ansible_host }}"
          - --port
          - "23"
          - --username
          - "{{ verify_cowrie_username }}"
          - --password
          - "{{ verify_cowrie_password }}"
          - --command
          - "wget {{ verify_cowrie_download_url }}"
      delegate_to: localhost
      become: false
      register: verify_cowrie_telnet
      changed_when: false
      failed_when: false

    - name: Probe the proxy port on the Sensor public IPv4
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ proxy_port }}"
        timeout: 10
      delegate_to: localhost
      become: false
      register: verify_proxy_port
      failed_when: false

    - name: Read the Containment drop counter again
      ansible.builtin.command:
        cmd: nft list chain inet filter forward
      register: verify_containment_after
      changed_when: false
      check_mode: false

    - name: Require Cowrie on ports 22 and 23, a closed proxy port and a contained download
      vars:
        verify_telnet_session: "{{ verify_cowrie_telnet.stdout | default('{}', true) | from_json }}"
        verify_drops_before: "{{ (verify_containment_before.stdout | regex_findall('counter packets ([0-9]+)')) + ['-1'] }}"
        verify_drops_after: "{{ (verify_containment_after.stdout | regex_findall('counter packets ([0-9]+)')) + ['-1'] }}"
      ansible.builtin.assert:
        that:
          - "'Timeout' not in verify_cowrie_banner.msg | default('')"
          - verify_cowrie_telnet.rc == 0
          - verify_telnet_session.negotiation | default('') is match('ff')
          - "'Timeout' in verify_proxy_port.msg | default('')"
          - verify_drops_after | first | int > verify_drops_before | first | int
        fail_msg: >-
          port 22 banner={{ verify_cowrie_banner.msg | default('matched') }};
          port 23 session={{ verify_cowrie_telnet.stderr | default('') | trim }}{{ verify_telnet_session.command_output | default('') }};
          proxy port {{ proxy_port }}={{ verify_proxy_port.msg | default('answered') }};
          Containment drops before={{ verify_drops_before | first }} after={{ verify_drops_after | first }}

- name: Verify OpenCanary and the Dark Port from the workstation
  hosts: sensors
  gather_facts: false
  become: false

  tasks:
    - name: Grab the OpenCanary FTP banner on port 21
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 21
        search_regex: (220 [^\r\n]+)
        timeout: 30
      delegate_to: localhost
      register: verify_opencanary_ftp_banner
      failed_when: false

    - name: Try an FTP login on port 21
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --max-time
          - "20"
          - --user
          - "{{ verify_opencanary_username }}:{{ verify_opencanary_password }}"
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - "ftp://{{ ansible_host }}/"
      delegate_to: localhost
      register: verify_opencanary_ftp_login
      changed_when: false
      failed_when: false

    # follow_redirects is safe by default, so this GET follows / to
    # /index.html and OpenCanary records both the redirect and the GET.
    - name: Send an HTTP GET to port 80
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}/"
        timeout: 20
      delegate_to: localhost
      register: verify_opencanary_http
      failed_when: false

    - name: Grab the OpenCanary MySQL banner on port 3306
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 3306
        search_regex: (5\.5\.43-[-.\w]+)
        timeout: 30
      delegate_to: localhost
      register: verify_opencanary_mysql_banner
      failed_when: false

    - name: Try a MySQL login on port 3306
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/files/opencanary_mysql_probe.py"
          - --host
          - "{{ ansible_host }}"
          - --username
          - "{{ verify_opencanary_username }}"
          - --password
          - "{{ verify_opencanary_password }}"
      delegate_to: localhost
      register: verify_opencanary_mysql
      changed_when: false
      failed_when: false

    # MSSQL does not speak first, so TDS needs a client prelogin packet
    # before the login the honeypot records.
    - name: Try an MSSQL login on port 1433
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/files/opencanary_mssql_probe.py"
          - --host
          - "{{ ansible_host }}"
          - --username
          - "{{ verify_opencanary_username }}"
          - --password
          - "{{ verify_opencanary_password }}"
      delegate_to: localhost
      register: verify_opencanary_mssql
      changed_when: false
      failed_when: false

    - name: Probe the Dark Port on the Sensor public IPv4
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 445
        timeout: 10
      delegate_to: localhost
      register: verify_dark_port
      failed_when: false

    - name: Require OpenCanary on ports 21, 80, 1433 and 3306 and a Dark Port on 445
      vars:
        verify_mysql_login: "{{ verify_opencanary_mysql.stdout | default('{}', true) | from_json }}"
        verify_mssql_login: "{{ verify_opencanary_mssql.stdout | default('{}', true) | from_json }}"
      ansible.builtin.assert:
        that:
          - "'Timeout' not in verify_opencanary_ftp_banner.msg | default('')"
          - verify_opencanary_ftp_login.stdout == '530'
          - verify_opencanary_http.status | default(0) == 200
          - "'Apache/2.2.22' in verify_opencanary_http.server | default('')"
          - "'Timeout' not in verify_opencanary_mysql_banner.msg | default('')"
          - verify_mysql_login.error_code | default(0) == 1045
          - verify_mssql_login.error_number | default(0) == 18456
          - "'Timeout' in verify_dark_port.msg | default('')"
        fail_msg: >-
          port 21 banner={{ verify_opencanary_ftp_banner.msg | default('matched') }};
          port 21 login={{ verify_opencanary_ftp_login.stdout | default('') }};
          port 80 status={{ verify_opencanary_http.status | default('') }} server={{ verify_opencanary_http.server | default('') }};
          port 3306 banner={{ verify_opencanary_mysql_banner.msg | default('matched') }};
          port 3306 login={{ verify_opencanary_mysql.stderr | default('') | trim }}{{ verify_mysql_login.error_message | default('') }};
          port 1433 login={{ verify_opencanary_mssql.stderr | default('') | trim }}{{ verify_mssql_login.error_message | default('') }};
          port 445={{ verify_dark_port.msg | default('answered') }}

- name: Verify every Honeynet host from inside
  hosts: all
  gather_facts: false

  vars:
    verify_is_sensor: "{{ 'sensors' in group_names }}"
    verify_sshd_baseline:
      port: "{{ ansible_port | default(22) | string }}"
      hostkeyalgorithms: ssh-ed25519
      kexalgorithms: sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
      ciphers: aes256-gcm@openssh.com,aes128-gcm@openssh.com
      macs: hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
      pubkeyauthentication: "yes"
      passwordauthentication: "no"
      kbdinteractiveauthentication: "no"
      permitrootlogin: "no"
      allowusers: "{{ 'admin' if verify_is_sensor else 'admin@' ~ sensor_private_ip }}"
      maxauthtries: "3"
      logingracetime: "20"
      x11forwarding: "no"
      allowagentforwarding: "no"
      permittunnel: "no"
      allowtcpforwarding: "{{ 'local' if verify_is_sensor else 'no' }}"

  tasks:
    - name: Read the effective sshd config
      ansible.builtin.command:
        cmd: sshd -T
      register: verify_sshd
      changed_when: false
      check_mode: false

    - name: Read the global IPv6 addresses
      ansible.builtin.command:
        cmd: ip -6 -o addr show scope global
      register: verify_ipv6
      changed_when: false
      check_mode: false

    - name: Read the global IPv4 addresses
      ansible.builtin.command:
        cmd: ip -4 -o addr show scope global
      register: verify_ipv4
      changed_when: false
      check_mode: false

    - name: Require the SSH hardening baseline
      vars:
        verify_sshd_effective: "{{ dict(verify_sshd.stdout_lines | select('search', ' ') | map('split', ' ', 1)) }}"
      ansible.builtin.assert:
        that: verify_sshd_effective[item.key] | default('') == item.value
        fail_msg: "sshd {{ item.key }} is '{{ verify_sshd_effective[item.key] | default('') }}', expected '{{ item.value }}'"
        quiet: true
      loop: "{{ verify_sshd_baseline | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Require an Ed25519 host key only and no public IPv6
      ansible.builtin.assert:
        that:
          - verify_sshd.stdout_lines | select('match', '^hostkey ') | list == ['hostkey /etc/ssh/ssh_host_ed25519_key']
          - verify_ipv6.stdout | trim == ''
        fail_msg: >-
          host keys={{ verify_sshd.stdout_lines | select('match', '^hostkey ') | list }};
          global IPv6={{ verify_ipv6.stdout_lines }}

    # Docker keeps its bridge addresses on the Honeypot, so they are not
    # addresses of the host itself.
    - name: Require the private IP as the only IPv4 address of a Honeypot
      vars:
        verify_host_ipv4: >-
          {{ verify_ipv4.stdout_lines | reject('search', '^[0-9]+: (docker0|br-|veth)')
             | map('regex_findall', 'inet ([0-9.]+)/') | flatten | list }}
      ansible.builtin.assert:
        that: verify_host_ipv4 == [ansible_host]
        fail_msg: "global IPv4={{ verify_ipv4.stdout_lines }}"
      when: not verify_is_sensor

- name: Verify Containment and SSH isolation from each Honeypot
  hosts: honeypots
  gather_facts: false
  become: false

  vars:
    verify_internet_host: 1.1.1.1
    verify_internet_port: 443
    verify_peer_honeypots: "{{ groups['honeypots'] | difference([inventory_hostname]) }}"

  tasks:
    - name: Open a direct TCP connection to the internet
      ansible.builtin.wait_for:
        host: "{{ verify_internet_host }}"
        port: "{{ verify_internet_port }}"
        timeout: 10
      register: verify_direct_outbound
      failed_when: false

    - name: Open an SSH connection to the other Honeypots
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].ansible_host }}"
        port: 22
        timeout: 10
      loop: "{{ verify_peer_honeypots }}"
      register: verify_peer_ssh
      failed_when: false

    - name: Require Containment and no SSH between Honeypots
      ansible.builtin.assert:
        that:
          - "'Timeout' in verify_direct_outbound.msg | default('')"
          - verify_peer_ssh.results | map(attribute='msg', default='') | reject('search', 'Timeout') | list == []
        fail_msg: >-
          direct outbound to {{ verify_internet_host }}:{{ verify_internet_port }}={{ verify_direct_outbound.msg | default('connected') }};
          SSH to the other Honeypots={{ verify_peer_ssh.results | map(attribute='msg', default='connected') | list }}

- name: Verify the Cowrie sessions and the allowlist proxy from each Honeypot
  hosts: honeypots
  gather_facts: false

  vars:
    verify_cowrie_log: "{{ cowrie_dir }}/var/log/cowrie/cowrie.json"
    verify_workstation_ip: "{{ hostvars['sensor'].verify_workstation_ip }}"
    verify_allowlisted_url: http://archive.ubuntu.com/ubuntu/dists/noble/Release
    verify_denied_url: http://example.com/

  tasks:
    - name: Read the sessions Cowrie recorded
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, sys
            source_ips, commands = set(), []
            with open(sys.argv[1]) as log:
                for line in log:
                    event = json.loads(line)
                    if "src_ip" in event:
                        source_ips.add(event["src_ip"])
                    if event.get("eventid") == "cowrie.command.input":
                        commands.append(event.get("input", ""))
            print(json.dumps({"source_ips": sorted(source_ips), "commands": commands}))
          - "{{ verify_cowrie_log }}"
      register: verify_cowrie_sessions
      changed_when: false
      check_mode: false

    - name: Request an allowlisted domain through the proxy
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --max-time
          - "20"
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - --proxy
          - "{{ honeynet_proxy_url }}"
          - "{{ verify_allowlisted_url }}"
      register: verify_proxy_allowed
      changed_when: false
      failed_when: false

    - name: Request a domain that is not on the allowlist through the proxy
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --max-time
          - "20"
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - --proxy
          - "{{ honeynet_proxy_url }}"
          - "{{ verify_denied_url }}"
      register: verify_proxy_denied
      changed_when: false
      failed_when: false

    - name: Require the attacker address in the Cowrie log and an allowlist that refuses
      vars:
        verify_cowrie_session: "{{ verify_cowrie_sessions.stdout | default('{}', true) | from_json }}"
      ansible.builtin.assert:
        that:
          - verify_workstation_ip in verify_cowrie_session.source_ips | default([])
          - sensor_private_ip not in verify_cowrie_session.source_ips | default([])
          - verify_cowrie_session.commands | default([]) | select('search', verify_cowrie_download_url) | list | length > 0
          - verify_proxy_allowed.stdout == '200'
          - verify_proxy_denied.stdout == '403'
        fail_msg: >-
          Cowrie source addresses={{ verify_cowrie_session.source_ips | default('none') }};
          Cowrie commands={{ verify_cowrie_session.commands | default('none') }};
          allowlisted domain={{ verify_proxy_allowed.stdout | default('') }} {{ verify_proxy_allowed.stderr | default('') | trim }};
          domain not on the allowlist={{ verify_proxy_denied.stdout | default('') }} {{ verify_proxy_denied.stderr | default('') | trim }}

- name: Verify the OpenCanary records from each Honeypot
  hosts: honeypots
  gather_facts: false

  vars:
    verify_opencanary_log: "{{ opencanary_dir }}/var/opencanary.log"
    verify_workstation_ip: "{{ hostvars['sensor'].verify_workstation_ip }}"
    # FTP login attempt, HTTP GET, MySQL login attempt and MSSQL SQL-auth login.
    verify_opencanary_logtypes: [2000, 3000, 8001, 9001]

  tasks:
    - name: Read the records OpenCanary wrote
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, sys
            source_hosts, logtypes = set(), set()
            with open(sys.argv[1]) as log:
                for line in log:
                    record = json.loads(line)
                    source_hosts.add(record.get("src_host", ""))
                    logtypes.add(record.get("logtype"))
            print(json.dumps({"source_hosts": sorted(source_hosts), "logtypes": sorted(logtypes)}))
          - "{{ verify_opencanary_log }}"
      register: verify_opencanary_records
      changed_when: false
      check_mode: false

    - name: Require the attacker address in the OpenCanary log and one record of each logtype
      vars:
        verify_opencanary_record: "{{ verify_opencanary_records.stdout | default('{}', true) | from_json }}"
      ansible.builtin.assert:
        that:
          - verify_workstation_ip in verify_opencanary_record.source_hosts | default([])
          - sensor_private_ip not in verify_opencanary_record.source_hosts | default([])
          - verify_opencanary_logtypes | difference(verify_opencanary_record.logtypes | default([])) == []
        fail_msg: >-
          OpenCanary source addresses={{ verify_opencanary_record.source_hosts | default('none') }};
          OpenCanary logtypes={{ verify_opencanary_record.logtypes | default('none') }}

- name: Verify Suricata on the Sensor
  hosts: sensors
  gather_facts: false

  vars:
    verify_eve_log: /var/log/suricata/eve.json
    verify_suricata_rule_directories:
      - /var/lib/suricata/rules
      - /etc/suricata/rules
    verify_suricata_owned_directories:
      - /var/lib/suricata
      - /var/log/suricata
    verify_suricata_expected_alerts: >-
      {{ [suricata_canary_rules.alert.sid ~ ' allowed']
         + ([suricata_canary_rules.drop.sid ~ ' blocked'] if suricata_mode == 'ips' else []) }}

  tasks:
    - name: Read the account that runs Suricata
      ansible.builtin.shell:
        cmd: ps -o user= -p "$(systemctl show --property MainPID --value suricata.service)"
      register: verify_suricata_account
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Read the NFQUEUE bindings
      ansible.builtin.command:
        cmd: cat /proc/net/netfilter/nfnetlink_queue
      register: verify_nfqueue
      changed_when: false
      failed_when: false
      check_mode: false

    # The first fetch runs as root before the role gives the rule tree to the
    # account, so the timer run proves that the account can replace those files.
    - name: Update the rules as the Suricata account
      ansible.builtin.systemd_service:
        name: suricata-update.service
        state: started
      register: verify_suricata_update
      changed_when: false
      ignore_errors: true

    - name: Read the files below the Suricata trees that the account does not own
      ansible.builtin.command:
        argv: "{{ ['find'] + verify_suricata_owned_directories + ['!', '-user', 'suricata', '-print'] }}"
      register: verify_suricata_foreign_files
      changed_when: false
      check_mode: false

    - name: Read the rule files that the Suricata account cannot read
      ansible.builtin.command:
        argv: "{{ ['runuser', '-u', 'suricata', '--', 'find'] + verify_suricata_rule_directories + ['-type', 'f', '!', '-readable', '-print'] }}"
      register: verify_suricata_unreadable_rules
      changed_when: false
      check_mode: false

    - name: Load the user data rule set in an empty network namespace
      ansible.builtin.shell:
        cmd: unshare --net sh -c 'nft -f /etc/nftables.conf && nft --stateless list ruleset'
      register: verify_user_data_ruleset
      changed_when: false
      check_mode: false

    - name: Read the live rule set
      ansible.builtin.command:
        cmd: nft --stateless list ruleset
      register: verify_live_ruleset
      changed_when: false
      check_mode: false

    - name: Read the EVE log size and the Sensor time before the probes
      ansible.builtin.shell:
        cmd: stat --format %s {{ verify_eve_log }} && date +%s
      register: verify_eve_start
      changed_when: false
      check_mode: false

    - name: Keep the start of the probes
      ansible.builtin.set_fact:
        verify_eve_offset: "{{ verify_eve_start.stdout_lines[0] }}"
        verify_probe_epoch: "{{ verify_eve_start.stdout_lines[1] }}"
        verify_canary_nonce: verify-{{ verify_eve_start.stdout_lines[1] }}

    - name: Send the canary alert string to Cowrie on port 23
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/files/cowrie_telnet_probe.py"
          - --host
          - "{{ ansible_host }}"
          - --username
          - "{{ verify_cowrie_username }}"
          - --password
          - "{{ verify_cowrie_password }}"
          - --command
          - echo {{ suricata_canary_rules.alert.content }} {{ verify_canary_nonce }}
      delegate_to: localhost
      become: false
      register: verify_canary_alert_session
      changed_when: false
      failed_when: false

    - name: Send the canary drop string to Cowrie on port 23
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/files/cowrie_telnet_probe.py"
          - --host
          - "{{ ansible_host }}"
          - --username
          - "{{ verify_cowrie_username }}"
          - --password
          - "{{ verify_cowrie_password }}"
          - --command
          - echo {{ suricata_canary_rules.drop.content }} {{ verify_canary_nonce }}
          - --timeout
          - "20"
      delegate_to: localhost
      become: false
      register: verify_canary_drop_session
      changed_when: false
      failed_when: false
      when: suricata_mode == 'ips'

    - name: Probe the Dark Port again for the EVE check
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 445
        timeout: 5
      delegate_to: localhost
      become: false
      failed_when: false

    # Suricata writes the flow event of an unanswered connection only when the
    # flow times out, so this waits for some minutes. logrotate can rotate the
    # log after the size was read, and then the reader starts at the top.
    - name: Read the EVE events from the workstation since the probes started
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, sys
            log_path, offset, workstation_ip = sys.argv[1], int(sys.argv[2]), sys.argv[3]
            alerts, dark_port_events = set(), set()
            with open(log_path, "rb") as log:
                log.seek(0, 2)
                log.seek(offset if log.tell() >= offset else 0)
                for line in log:
                    try:
                        event = json.loads(line)
                    except ValueError:
                        continue
                    if event.get("src_ip") != workstation_ip:
                        continue
                    if event.get("event_type") == "alert":
                        alerts.add(f'{event["alert"]["signature_id"]} {event["alert"]["action"]}')
                    if event.get("dest_port") == 445:
                        dark_port_events.add(event.get("event_type"))
            print(json.dumps({"alerts": sorted(alerts), "dark_port_events": sorted(dark_port_events)}))
          - "{{ verify_eve_log }}"
          - "{{ verify_eve_offset }}"
          - "{{ verify_workstation_ip }}"
      register: verify_eve_events
      changed_when: false
      check_mode: false
      retries: 18
      delay: 10
      until: >-
        verify_suricata_expected_alerts
        | difference((verify_eve_events.stdout | default('{}', true) | from_json).alerts | default([]))
        == []
        and (verify_eve_events.stdout | default('{}', true) | from_json).dark_port_events | default([]) | length > 0
      ignore_errors: true

    # On the first alert of a flow Suricata writes the earlier segments of the
    # flow too, so the file holds the payload with the canary string.
    - name: Find the PCAP file of the canary alert flow
      ansible.builtin.command:
        argv:
          - find
          - /var/log/suricata
          - -maxdepth
          - "1"
          - -name
          - log.pcap*
          - -newermt
          - "@{{ verify_probe_epoch }}"
          - -exec
          - grep
          - --files-with-matches
          - --text
          - --fixed-strings
          - --regexp
          - "{{ suricata_canary_rules.alert.content }} {{ verify_canary_nonce }}"
          - "{}"
          - +
      register: verify_canary_pcap
      changed_when: false
      check_mode: false
      retries: 6
      delay: 10
      until: verify_canary_pcap.stdout | length > 0
      failed_when: false
      ignore_errors: true

    - name: Require Suricata as its account, readable rules and the user data rule set
      vars:
        verify_nfqueue_numbers: "{{ verify_nfqueue.stdout_lines | map('split') | map('first') | list }}"
      ansible.builtin.assert:
        that:
          - verify_suricata_account.stdout | trim == 'suricata'
          - suricata_mode != 'ips' or '0' in verify_nfqueue_numbers
          - verify_suricata_update is succeeded
          - verify_suricata_foreign_files.stdout_lines == []
          - verify_suricata_unreadable_rules.stdout_lines == []
          - verify_live_ruleset.stdout == verify_user_data_ruleset.stdout
        fail_msg: >-
          Suricata account={{ verify_suricata_account.stdout | trim }};
          NFQUEUE bindings={{ verify_nfqueue.stdout_lines }};
          rule update={{ verify_suricata_update.msg | default('passed') }};
          files the account does not own={{ verify_suricata_foreign_files.stdout_lines }};
          rule files the account cannot read={{ verify_suricata_unreadable_rules.stdout_lines }};
          live rule set is the user data rule set={{ verify_live_ruleset.stdout == verify_user_data_ruleset.stdout }}

    - name: Require the canary alerts, a PCAP file of the alert flow and EVE events from the Dark Port
      vars:
        verify_eve: "{{ verify_eve_events.stdout | default('{}', true) | from_json }}"
        verify_alert_session: "{{ verify_canary_alert_session.stdout | default('{}', true) | from_json }}"
        verify_drop_session: "{{ verify_canary_drop_session.stdout | default('{}', true) | from_json }}"
      ansible.builtin.assert:
        that:
          - verify_alert_session.command_completed | default(false)
          - suricata_mode != 'ips' or not verify_drop_session.command_completed | default(true)
          - verify_suricata_expected_alerts | difference(verify_eve.alerts | default([])) == []
          - verify_canary_pcap.stdout_lines | length > 0
          - verify_eve.dark_port_events | default([]) | length > 0
        fail_msg: >-
          alert session={{ verify_canary_alert_session.stderr | default('') | trim }}{{ verify_alert_session.command_output | default('') }};
          drop session completed={{ verify_drop_session.command_completed | default('not run') }};
          expected alerts={{ verify_suricata_expected_alerts }};
          EVE alerts={{ verify_eve.alerts | default('none') }};
          PCAP files of the alert flow={{ verify_canary_pcap.stdout_lines }};
          EVE events from the Dark Port={{ verify_eve.dark_port_events | default('none') }}

- name: Verify that the Sensor fails open with Suricata stopped in IPS mode
  hosts: sensors
  gather_facts: false

  vars:
    verify_honeypot: "{{ groups['honeypots'] | first }}"

  tasks:
    - name: Run the checks with Suricata stopped
      when: suricata_mode == 'ips'
      block:
        - name: Stop Suricata
          ansible.builtin.systemd_service:
            name: suricata.service
            state: stopped

        - name: Read the Containment drop counter
          ansible.builtin.command:
            cmd: nft list chain inet filter forward
          register: verify_fail_open_containment_before
          changed_when: false

        - name: Grab the Cowrie SSH banner on port 22
          ansible.builtin.wait_for:
            host: "{{ ansible_host }}"
            port: 22
            search_regex: (SSH-2.0-.*)
            timeout: 30
          delegate_to: localhost
          become: false
          register: verify_fail_open_cowrie
          failed_when: false

        - name: Grab the OpenCanary FTP banner on port 21
          ansible.builtin.wait_for:
            host: "{{ ansible_host }}"
            port: 21
            search_regex: (220 [^\r\n]+)
            timeout: 30
          delegate_to: localhost
          become: false
          register: verify_fail_open_opencanary
          failed_when: false

        - name: Open a direct TCP connection from the Honeypot to the internet
          ansible.builtin.wait_for:
            host: 1.1.1.1
            port: 443
            timeout: 10
          delegate_to: "{{ verify_honeypot }}"
          become: false
          register: verify_fail_open_outbound
          failed_when: false

        - name: Read the Containment drop counter again
          ansible.builtin.command:
            cmd: nft list chain inet filter forward
          register: verify_fail_open_containment_after
          changed_when: false

      always:
        - name: Start Suricata again
          ansible.builtin.systemd_service:
            name: suricata.service
            state: started

    - name: Require open honeypot ports and Containment with Suricata stopped
      when: suricata_mode == 'ips'
      vars:
        verify_drops_before: "{{ (verify_fail_open_containment_before.stdout | regex_findall('counter packets ([0-9]+)')) + ['-1'] }}"
        verify_drops_after: "{{ (verify_fail_open_containment_after.stdout | regex_findall('counter packets ([0-9]+)')) + ['-1'] }}"
      ansible.builtin.assert:
        that:
          - "'Timeout' not in verify_fail_open_cowrie.msg | default('')"
          - "'Timeout' not in verify_fail_open_opencanary.msg | default('')"
          - "'Timeout' in verify_fail_open_outbound.msg | default('')"
          - verify_drops_after | first | int > verify_drops_before | first | int
        fail_msg: >-
          port 22 banner={{ verify_fail_open_cowrie.msg | default('matched') }};
          port 21 banner={{ verify_fail_open_opencanary.msg | default('matched') }};
          direct outbound from {{ verify_honeypot }}={{ verify_fail_open_outbound.msg | default('connected') }};
          Containment drops before={{ verify_drops_before | first }} after={{ verify_drops_after | first }}
