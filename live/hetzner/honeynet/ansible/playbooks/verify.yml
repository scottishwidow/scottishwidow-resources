---
- name: Verify the Sensor from the workstation
  hosts: sensors
  gather_facts: false
  become: false

  vars:
    verify_ssh_key: "{{ lookup('ansible.builtin.config', 'DEFAULT_PRIVATE_KEY_FILE') | expanduser }}"
    verify_ssh: >-
      ssh -o BatchMode=yes -o ConnectTimeout=10
      -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={{ playbook_dir }}/../.known_hosts
      -p {{ ansible_port }}

  tasks:
    - name: Log in on the admin SSH port with the Honeynet key
      ansible.builtin.command:
        cmd: "{{ verify_ssh }} -o IdentitiesOnly=yes -i {{ verify_ssh_key | quote }} admin@{{ ansible_host }} true"
      delegate_to: localhost
      register: verify_key_login
      changed_when: false
      failed_when: false

    - name: Try a password login on the admin SSH port
      ansible.builtin.command:
        cmd: >-
          {{ verify_ssh }} -o PubkeyAuthentication=no
          -o PreferredAuthentications=password,keyboard-interactive
          admin@{{ ansible_host }} true
      delegate_to: localhost
      register: verify_password_login
      changed_when: false
      failed_when: false

    - name: Require key-only SSH on the admin port
      ansible.builtin.assert:
        that:
          - verify_key_login.rc == 0
          - verify_password_login.rc == 255
          - "'Permission denied (publickey)' in verify_password_login.stderr"
        fail_msg: >-
          key login stderr={{ verify_key_login.stderr | trim }};
          password login stderr={{ verify_password_login.stderr | trim }}

- name: Verify Cowrie and the allowlist proxy from the workstation
  hosts: sensors
  gather_facts: false

  tasks:
    - name: Read the address the workstation connects from
      ansible.builtin.shell:
        cmd: echo "$SSH_CONNECTION"
      become: false
      register: verify_ssh_connection
      changed_when: false
      check_mode: false

    - name: Keep the workstation address for the Honeypot checks
      ansible.builtin.set_fact:
        verify_workstation_ip: "{{ verify_ssh_connection.stdout.split() | first }}"

    - name: Read the Containment drop counter
      ansible.builtin.command:
        cmd: nft list chain inet filter forward
      register: verify_containment_before
      changed_when: false
      check_mode: false

    - name: Grab the Cowrie SSH banner on port 22
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        search_regex: (SSH-2.0-.*)
        timeout: 30
      delegate_to: localhost
      become: false
      register: verify_cowrie_banner
      failed_when: false

    - name: Log in to Cowrie on port 23 and download a file
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/files/cowrie_telnet_probe.py"
          - --host
          - "{{ ansible_host }}"
          - --port
          - "23"
          - --username
          - "{{ verify_cowrie_username }}"
          - --password
          - "{{ verify_cowrie_password }}"
          - --command
          - "wget {{ verify_cowrie_download_url }}"
      delegate_to: localhost
      become: false
      register: verify_cowrie_telnet
      changed_when: false
      failed_when: false

    - name: Probe the proxy port on the Sensor public IPv4
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ proxy_port }}"
        timeout: 10
      delegate_to: localhost
      become: false
      register: verify_proxy_port
      failed_when: false

    - name: Read the Containment drop counter again
      ansible.builtin.command:
        cmd: nft list chain inet filter forward
      register: verify_containment_after
      changed_when: false
      check_mode: false

    - name: Require Cowrie on ports 22 and 23, a closed proxy port and a contained download
      vars:
        verify_telnet_session: "{{ verify_cowrie_telnet.stdout | default('{}', true) | from_json }}"
        verify_drops_before: "{{ (verify_containment_before.stdout | regex_findall('counter packets ([0-9]+)')) + ['-1'] }}"
        verify_drops_after: "{{ (verify_containment_after.stdout | regex_findall('counter packets ([0-9]+)')) + ['-1'] }}"
      ansible.builtin.assert:
        that:
          - verify_cowrie_banner.match_groups | default([]) | length == 1
          - verify_cowrie_telnet.rc == 0
          - verify_telnet_session.negotiation | default('') is match('ff')
          - "'Timeout' in verify_proxy_port.msg | default('')"
          - verify_drops_after | first | int > verify_drops_before | first | int
        fail_msg: >-
          port 22 banner={{ verify_cowrie_banner.match_groups | default('none') }};
          port 23 session={{ verify_cowrie_telnet.stderr | default('') | trim }}{{ verify_telnet_session.command_output | default('') }};
          proxy port {{ proxy_port }}={{ verify_proxy_port.msg | default('answered') }};
          Containment drops before={{ verify_drops_before | first }} after={{ verify_drops_after | first }}

- name: Verify every Honeynet host from inside
  hosts: all
  gather_facts: false

  vars:
    verify_is_sensor: "{{ 'sensors' in group_names }}"
    verify_sshd_baseline:
      port: "{{ ansible_port | default(22) | string }}"
      hostkeyalgorithms: ssh-ed25519
      kexalgorithms: sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
      ciphers: aes256-gcm@openssh.com,aes128-gcm@openssh.com
      macs: hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com
      pubkeyauthentication: "yes"
      passwordauthentication: "no"
      kbdinteractiveauthentication: "no"
      permitrootlogin: "no"
      allowusers: "{{ 'admin' if verify_is_sensor else 'admin@' ~ sensor_private_ip }}"
      maxauthtries: "3"
      logingracetime: "20"
      x11forwarding: "no"
      allowagentforwarding: "no"
      permittunnel: "no"
      allowtcpforwarding: "{{ 'local' if verify_is_sensor else 'no' }}"

  tasks:
    - name: Read the effective sshd config
      ansible.builtin.command:
        cmd: sshd -T
      register: verify_sshd
      changed_when: false
      check_mode: false

    - name: Read the global IPv6 addresses
      ansible.builtin.command:
        cmd: ip -6 -o addr show scope global
      register: verify_ipv6
      changed_when: false
      check_mode: false

    - name: Read the global IPv4 addresses
      ansible.builtin.command:
        cmd: ip -4 -o addr show scope global
      register: verify_ipv4
      changed_when: false
      check_mode: false

    - name: Require the SSH hardening baseline
      vars:
        verify_sshd_effective: "{{ dict(verify_sshd.stdout_lines | select('search', ' ') | map('split', ' ', 1)) }}"
      ansible.builtin.assert:
        that: verify_sshd_effective[item.key] | default('') == item.value
        fail_msg: "sshd {{ item.key }} is '{{ verify_sshd_effective[item.key] | default('') }}', expected '{{ item.value }}'"
        quiet: true
      loop: "{{ verify_sshd_baseline | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Require an Ed25519 host key only and no public IPv6
      ansible.builtin.assert:
        that:
          - verify_sshd.stdout_lines | select('match', '^hostkey ') | list == ['hostkey /etc/ssh/ssh_host_ed25519_key']
          - verify_ipv6.stdout | trim == ''
        fail_msg: >-
          host keys={{ verify_sshd.stdout_lines | select('match', '^hostkey ') | list }};
          global IPv6={{ verify_ipv6.stdout_lines }}

    - name: Require the private IP as the only IPv4 address of a Honeypot
      ansible.builtin.assert:
        that: verify_ipv4.stdout | regex_findall('inet ([0-9.]+)/') == [ansible_host]
        fail_msg: "global IPv4={{ verify_ipv4.stdout_lines }}"
      when: not verify_is_sensor

- name: Verify Containment and SSH isolation from each Honeypot
  hosts: honeypots
  gather_facts: false
  become: false

  vars:
    verify_internet_host: 1.1.1.1
    verify_internet_port: 443
    verify_peer_honeypots: "{{ groups['honeypots'] | difference([inventory_hostname]) }}"

  tasks:
    - name: Open a direct TCP connection to the internet
      ansible.builtin.wait_for:
        host: "{{ verify_internet_host }}"
        port: "{{ verify_internet_port }}"
        timeout: 10
      register: verify_direct_outbound
      failed_when: false

    - name: Open an SSH connection to the other Honeypots
      ansible.builtin.wait_for:
        host: "{{ hostvars[item].ansible_host }}"
        port: 22
        timeout: 10
      loop: "{{ verify_peer_honeypots }}"
      register: verify_peer_ssh
      failed_when: false

    - name: Require Containment and no SSH between Honeypots
      ansible.builtin.assert:
        that:
          - "'Timeout' in verify_direct_outbound.msg | default('')"
          - verify_peer_ssh.results | map(attribute='msg', default='') | reject('search', 'Timeout') | list == []
        fail_msg: >-
          direct outbound to {{ verify_internet_host }}:{{ verify_internet_port }}={{ verify_direct_outbound.msg | default('connected') }};
          SSH to the other Honeypots={{ verify_peer_ssh.results | map(attribute='msg', default='connected') | list }}

- name: Verify the Cowrie sessions and the allowlist proxy from each Honeypot
  hosts: honeypots
  gather_facts: false

  vars:
    verify_cowrie_log: "{{ cowrie_dir }}/var/log/cowrie/cowrie.json"
    verify_workstation_ip: "{{ hostvars['sensor'].verify_workstation_ip }}"
    verify_allowlisted_url: http://archive.ubuntu.com/ubuntu/dists/noble/Release
    verify_denied_url: http://example.com/

  tasks:
    - name: Read the sessions Cowrie recorded
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, sys
            source_ips, commands = set(), []
            with open(sys.argv[1]) as log:
                for line in log:
                    event = json.loads(line)
                    if "src_ip" in event:
                        source_ips.add(event["src_ip"])
                    if event.get("eventid") == "cowrie.command.input":
                        commands.append(event.get("input", ""))
            print(json.dumps({"source_ips": sorted(source_ips), "commands": commands}))
          - "{{ verify_cowrie_log }}"
      register: verify_cowrie_sessions
      changed_when: false
      check_mode: false

    - name: Request an allowlisted domain through the proxy
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --max-time
          - "20"
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - --proxy
          - "{{ honeynet_proxy_url }}"
          - "{{ verify_allowlisted_url }}"
      register: verify_proxy_allowed
      changed_when: false
      failed_when: false

    - name: Request a domain that is not on the allowlist through the proxy
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --max-time
          - "20"
          - --output
          - /dev/null
          - --write-out
          - "%{http_code}"
          - --proxy
          - "{{ honeynet_proxy_url }}"
          - "{{ verify_denied_url }}"
      register: verify_proxy_denied
      changed_when: false
      failed_when: false

    - name: Require the attacker address in the Cowrie log and an allowlist that refuses
      vars:
        verify_cowrie_session: "{{ verify_cowrie_sessions.stdout | default('{}', true) | from_json }}"
      ansible.builtin.assert:
        that:
          - verify_workstation_ip in verify_cowrie_session.source_ips | default([])
          - sensor_private_ip not in verify_cowrie_session.source_ips | default([])
          - verify_cowrie_session.commands | default([]) | select('search', verify_cowrie_download_url) | list | length > 0
          - verify_proxy_allowed.stdout == '200'
          - verify_proxy_denied.stdout == '403'
        fail_msg: >-
          Cowrie source addresses={{ verify_cowrie_session.source_ips | default('none') }};
          Cowrie commands={{ verify_cowrie_session.commands | default('none') }};
          allowlisted domain={{ verify_proxy_allowed.stdout | default('') }} {{ verify_proxy_allowed.stderr | default('') | trim }};
          domain not on the allowlist={{ verify_proxy_denied.stdout | default('') }} {{ verify_proxy_denied.stderr | default('') | trim }}
