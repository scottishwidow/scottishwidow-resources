---
- name: Reload the Sinkhole user units
  ansible.builtin.command:
    cmd: systemctl --user --machine {{ sinkhole_user }}@ daemon-reload  # noqa: command-instead-of-module
  changed_when: true

- name: Restart the Sinkhole HTTP service
  ansible.builtin.command:
    cmd: systemctl --user --machine {{ sinkhole_user }}@ restart sinkhole-http.service  # noqa: command-instead-of-module
  changed_when: true

- name: Restart the Sinkhole DNS service
  ansible.builtin.command:
    cmd: systemctl --user --machine {{ sinkhole_user }}@ restart sinkhole-dns.service  # noqa: command-instead-of-module
  changed_when: true
