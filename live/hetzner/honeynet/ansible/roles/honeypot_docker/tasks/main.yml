---
- name: Wait for cloud-init to finish
  ansible.builtin.command:
    cmd: cloud-init status --wait
  changed_when: false
  check_mode: false
  failed_when: false

- name: Point apt at the allowlist proxy
  ansible.builtin.template:
    src: apt-proxy.conf.j2
    dest: /etc/apt/apt.conf.d/01proxy
    owner: root
    group: root
    mode: "0644"

- name: Install Docker, Compose and dig
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
      - bind9-dnsutils
    update_cache: true
    cache_valid_time: 3600

- name: Point the Docker daemon at the allowlist proxy and the Sinkhole DNS
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart Docker

- name: Enable and start Docker
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started

- name: Apply the Docker configuration now
  ansible.builtin.meta: flush_handlers
