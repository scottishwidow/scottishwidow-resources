---
- name: Install Squid
  ansible.builtin.apt:
    name: squid
    update_cache: true
    cache_valid_time: 3600

- name: Create the Squid service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/squid.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# Squid exits when it cannot bind its listen address, and the private IP
# arrives over DHCP.
- name: Make Squid wait for the network
  ansible.builtin.template:
    src: squid-network-online.conf.j2
    dest: /etc/systemd/system/squid.service.d/10-network-online.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Squid

- name: Write the proxy config
  ansible.builtin.template:
    src: squid.conf.j2
    dest: /etc/squid/squid.conf
    owner: root
    group: root
    mode: "0644"
    validate: squid -k parse -f %s
  notify: Restart Squid

- name: Enable and start Squid
  ansible.builtin.systemd_service:
    name: squid.service
    enabled: true
    state: started
