---
- name: Wait for cloud-init to finish
  ansible.builtin.command:
    cmd: cloud-init status --wait
  changed_when: false
  check_mode: false
  failed_when: false

- name: Read IPv4 forwarding
  ansible.builtin.command:
    cmd: sysctl -n net.ipv4.ip_forward
  register: sensor_network_check_ip_forward
  changed_when: false
  check_mode: false

- name: Read the forward chain
  ansible.builtin.command:
    cmd: nft list chain inet filter forward
  register: sensor_network_check_forward_chain
  changed_when: false
  check_mode: false
  failed_when: false

- name: Read the input chain
  ansible.builtin.command:
    cmd: nft list chain inet filter input
  register: sensor_network_check_input_chain
  changed_when: false
  check_mode: false
  failed_when: false

- name: Read the DNAT chain
  ansible.builtin.command:
    cmd: nft list chain ip nat prerouting
  register: sensor_network_check_dnat_chain
  changed_when: false
  check_mode: false
  failed_when: false

- name: Require the host network from the Sensor user data
  vars:
    sensor_network_check_forward_rules: "{{ sensor_network_check_forward_chain.stdout_lines | map('trim') | reject('match', '^(table |chain |type |}|$)') | list }}"
    sensor_network_check_containment_rule: >-
      ^ip saddr {{ honeynet_network_ip_range }} ip daddr != {{ honeynet_network_ip_range }}
      ct state new counter packets [0-9]+ bytes [0-9]+ drop$
  ansible.builtin.assert:
    that: item.condition
    fail_msg: >-
      {{ item.missing }} is missing on the Sensor. It belongs to the Sensor user data in
      live/hetzner/honeynet/sensor, not to Ansible. Fix the template and replace the Sensor.
    quiet: true
  loop:
    - missing: IPv4 forwarding
      condition: "{{ sensor_network_check_ip_forward.stdout == '1' }}"
    - missing: "DNAT of the honeypot ports to {{ honeypot_1_private_ip }}"
      condition: "{{ sensor_network_check_dnat_chain.stdout is search('dnat to ' ~ honeypot_1_private_ip ~ '$', multiline=true) }}"
    - missing: "Containment with a drop counter as the first forward rule, with policy drop"
      condition: >-
        {{ sensor_network_check_forward_chain.stdout is search('policy drop;')
           and sensor_network_check_forward_rules[:1] | select('search', sensor_network_check_containment_rule) | list | length == 1 }}
    - missing: "The forward rule to queue 0 with bypass"
      condition: "{{ sensor_network_check_forward_rules | select('search', '^ct status dnat queue flags bypass to 0$') | list | length == 1 }}"
  loop_control:
    label: "{{ item.missing }}"

- name: Require the DNAT of the redirected honeypot ports
  ansible.builtin.assert:
    that: >-
      sensor_network_check_dnat_chain.stdout is search('tcp dport ' ~ item.key ~ ' dnat to '
      ~ honeypot_1_private_ip ~ ':' ~ item.value ~ '$', multiline=true)
    fail_msg: >-
      The DNAT of port {{ item.key }} to {{ honeypot_1_private_ip }}:{{ item.value }} is missing on the
      Sensor. It belongs to the Sensor user data in live/hetzner/honeynet/sensor, not to Ansible.
      Fix the template and replace the Sensor.
    quiet: true
  loop: "{{ honeypot_port_redirects | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Require the input rule to queue the Sinkhole flows
  vars:
    sensor_network_check_input_rules: "{{ sensor_network_check_input_chain.stdout_lines | map('trim') | reject('match', '^(table |chain |type |}|$)') | list }}"
    sensor_network_check_input_queue_rule: "ip saddr {{ honeynet_network_ip_range }} ct status dnat queue flags bypass to 0"
    sensor_network_check_input_established_rule: ct state established,related accept
  ansible.builtin.assert:
    that:
      - sensor_network_check_input_queue_rule in sensor_network_check_input_rules
      - sensor_network_check_input_established_rule in sensor_network_check_input_rules
      - >-
        sensor_network_check_input_rules.index(sensor_network_check_input_queue_rule)
        < sensor_network_check_input_rules.index(sensor_network_check_input_established_rule)
    fail_msg: >-
      The input rule to queue 0 with bypass for the Sinkhole flows, before the established rule,
      is missing on the Sensor. It belongs to the Sensor user data in live/hetzner/honeynet/sensor,
      not to Ansible. Fix the template and replace the Sensor.
    quiet: true

- name: Require the Sinkhole DNAT and the input rule for each Sinkhole port
  ansible.builtin.assert:
    that:
      - >-
        sensor_network_check_dnat_chain.stdout_lines | map('trim')
        | select('equalto', 'ip saddr ' ~ honeynet_network_ip_range ~ ' ip daddr != ' ~ honeynet_network_ip_range
          ~ ' ' ~ item.protocol ~ ' dport ' ~ item.port ~ ' dnat to ' ~ sensor_private_ip ~ ':' ~ item.sinkhole_port)
        | list | length == 1
      - >-
        sensor_network_check_input_chain.stdout_lines | map('trim')
        | select('equalto', 'ip saddr ' ~ honeynet_network_ip_range ~ ' ' ~ item.protocol ~ ' dport ' ~ item.sinkhole_port ~ ' accept')
        | list | length == 1
    fail_msg: >-
      The DNAT of {{ item.protocol }} port {{ item.port }} outside the Honeynet to
      {{ sensor_private_ip }}:{{ item.sinkhole_port }}, or the input rule that accepts it from the
      Honeynet network only, is missing on the Sensor. It belongs to the Sensor user data in
      live/hetzner/honeynet/sensor, not to Ansible. Fix the template and replace the Sensor.
    quiet: true
  loop: "{{ sinkhole_redirects }}"
  loop_control:
    label: "{{ item.protocol }} {{ item.port }}"
