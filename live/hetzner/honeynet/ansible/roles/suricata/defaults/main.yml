---
# Must match the Ubuntu release of the sensor_image default in
# live/hetzner/honeynet/sensor/variables.tf. The two move together.
suricata_ppa_suite: noble

# ids reads a copy of the traffic and cannot block. ips reads the queue that
# the forward chain of the Sensor user data fills, and gives a verdict on each
# packet.
suricata_mode: ids

# The queue number is a command line argument, not a setting in suricata.yaml,
# so the mode selects the arguments of the service.
suricata_capture_arguments:
  ids: --af-packet
  ips: -q 0

# Both modes see the traffic after DNAT, so the Honeypots are HOME_NET and the
# public IPv4 of the Sensor is not.
suricata_home_net: "{{ honeynet_network_ip_range }}"

# Suricata starts as root to open the capture and keeps the capture
# capabilities, then drops to this account for the rest of its run.
suricata_user: suricata
suricata_group: suricata

# Suricata writes the logs and reads the rules as suricata_user, so both trees
# belong to it.
suricata_owned_directories:
  - /var/log/suricata
  - /var/lib/suricata

# suricata-update rewrites the rules under /var/lib/suricata/rules, so the
# local rules live outside that tree and load after the fetched rules.
suricata_local_rules_path: /etc/suricata/rules/local.rules

# Suricata sees the Telnet session after DNAT, so the rules match the port
# Cowrie listens on, not public port 23.
suricata_cowrie_telnet_port: "{{ honeypot_port_redirects['23'] }}"
