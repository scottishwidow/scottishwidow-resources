---
suricata_ppa_suite: noble

suricata_capture_arguments:
  ids: --af-packet
  ips: -q 0

suricata_home_net: "{{ honeynet_network_ip_range }}"

suricata_user: suricata
suricata_group: suricata

suricata_pid_file: /run/suricata/suricata.pid

suricata_owned_directories:
  - /var/log/suricata
  - /var/lib/suricata

suricata_local_rules_path: /etc/suricata/rules/local.rules

suricata_cowrie_telnet_port: "{{ honeypot_port_redirects['23'] }}"

suricata_proxy_pass_sid: 1000003

suricata_pcap_file_size_limit: 100 MiB
suricata_pcap_max_files: 20

suricata_log_retention_days: 14

suricata_update_schedule: daily
suricata_update_randomized_delay: 1h
