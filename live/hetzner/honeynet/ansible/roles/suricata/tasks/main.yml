---
- name: Install the library the deb822 repository module needs
  ansible.builtin.apt:
    name: python3-debian
    update_cache: true
    cache_valid_time: 3600

# The Ubuntu archive carries an older Suricata, so the Sensor takes the
# stable release from the PPA the Suricata project maintains.
- name: Add the Suricata stable PPA
  ansible.builtin.deb822_repository:
    name: oisf-suricata-stable
    types: deb
    uris: https://ppa.launchpadcontent.net/oisf/suricata-stable/ubuntu
    suites: "{{ suricata_ppa_suite }}"
    components: main
    signed_by: "{{ lookup('ansible.builtin.file', 'oisf-suricata-stable.asc') }}"
    state: present
  register: suricata_ppa

- name: Read the package index of the PPA
  ansible.builtin.apt:
    update_cache: true
  when: suricata_ppa is changed

- name: Install Suricata
  ansible.builtin.apt:
    name: suricata
    update_cache: true
    cache_valid_time: 3600

- name: Create the Suricata group
  ansible.builtin.group:
    name: "{{ suricata_group }}"
    system: true

- name: Create the Suricata account
  ansible.builtin.user:
    name: "{{ suricata_user }}"
    group: "{{ suricata_group }}"
    home: /var/lib/suricata
    create_home: false
    shell: /usr/sbin/nologin
    system: true

# The package ships no rules, and Suricata refuses a config whose rule file is
# missing. The suricata-update timer keeps the rules current, so this runs once.
- name: Fetch the rules
  ansible.builtin.command:
    cmd: suricata-update --no-test
    creates: /var/lib/suricata/rules/suricata.rules

# af-packet needs the device name and the plays gather no facts, so the device
# follows from the private IP that the inventory pins.
- name: Read the interface that holds the private IP
  ansible.builtin.command:
    cmd: ip -4 -o addr show to {{ sensor_private_ip }}
  register: suricata_private_address
  changed_when: false
  check_mode: false

- name: Require an interface with the private IP
  ansible.builtin.assert:
    that: suricata_private_address.stdout | trim | length > 0
    fail_msg: >-
      No interface on the Sensor holds {{ sensor_private_ip }}. The private IP
      arrives over DHCP, so check that the network attachment is up.

- name: Keep the private interface for the config
  ansible.builtin.set_fact:
    suricata_private_interface: "{{ suricata_private_address.stdout.split()[1] }}"

# The package runs Suricata as root, so a Sensor that ran the earlier config
# holds root owned logs and rules that the account cannot write.
- name: Give the logs and the rules to the Suricata account
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ suricata_user }}"
    group: "{{ suricata_group }}"
    recurse: true
  loop: "{{ suricata_owned_directories }}"
  notify: Restart Suricata

- name: Create the local rules directory
  ansible.builtin.file:
    path: "{{ suricata_local_rules_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# The config check loads every rule file, so the local rules exist first.
- name: Write the local rules
  ansible.builtin.template:
    src: local.rules.j2
    dest: "{{ suricata_local_rules_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Suricata

- name: Write the Suricata config
  ansible.builtin.template:
    src: suricata.yaml.j2
    dest: /etc/suricata/suricata.yaml
    owner: root
    group: root
    mode: "0644"
    validate: suricata -T -c %s
  notify: Restart Suricata

- name: Install logrotate
  ansible.builtin.apt:
    name: logrotate
    update_cache: true
    cache_valid_time: 3600

# The package ships no logrotate config, so without this the logs grow until
# the disk is full. On SIGHUP Suricata opens the log files again.
- name: Rotate the Suricata logs
  ansible.builtin.template:
    src: suricata.logrotate.j2
    dest: /etc/logrotate.d/suricata
    owner: root
    group: root
    mode: "0644"
    validate: logrotate --debug %s

- name: Create the Suricata service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/suricata.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# The package creates the run directory once, at install, and /run is a tmpfs.
# Suricata opens the command socket in it after it drops to the account.
# RuntimeDirectory= cannot give the directory to the account, because systemd
# sets the owner back to the service user before each command it runs. So the
# service creates the directory from this entry on every start.
- name: Write the Suricata run directory entry
  ansible.builtin.template:
    src: suricata.tmpfiles.j2
    dest: /etc/tmpfiles.d/suricata.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Suricata

# The packaged service is Type=simple, so the process must stay in the
# foreground.
- name: Set the capture mode of the Suricata service
  ansible.builtin.template:
    src: suricata-capture-mode.conf.j2
    dest: /etc/systemd/system/suricata.service.d/10-capture-mode.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Suricata

- name: Enable and start Suricata
  ansible.builtin.systemd_service:
    name: suricata.service
    enabled: true
    state: started

- name: Write the rule update units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - suricata-update.service
    - suricata-update.timer
  register: suricata_update_units

- name: Enable and start the rule update timer
  ansible.builtin.systemd_service:
    name: suricata-update.timer
    daemon_reload: "{{ suricata_update_units is changed }}"
    enabled: true
    state: started
