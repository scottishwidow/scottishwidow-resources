---
- name: Install the library the deb822 repository module needs
  ansible.builtin.apt:
    name: python3-debian
    update_cache: true
    cache_valid_time: 3600

# The Ubuntu archive carries an older Suricata, so the Sensor takes the
# stable release from the PPA the Suricata project maintains.
- name: Add the Suricata stable PPA
  ansible.builtin.deb822_repository:
    name: oisf-suricata-stable
    types: deb
    uris: https://ppa.launchpadcontent.net/oisf/suricata-stable/ubuntu
    suites: "{{ suricata_ppa_suite }}"
    components: main
    signed_by: "{{ lookup('ansible.builtin.file', 'oisf-suricata-stable.asc') }}"
    state: present
  register: suricata_ppa

- name: Read the package index of the PPA
  ansible.builtin.apt:
    update_cache: true
  when: suricata_ppa is changed

- name: Install Suricata
  ansible.builtin.apt:
    name: suricata
    update_cache: true
    cache_valid_time: 3600
