name: 'IaC security triage'

# `workflow_dispatch` is the ONLY trigger, and that is a security boundary
# rather than a preference (design.md - Decision 11).
#
# This is the one workflow in the repository that reads AI_API_TOKEN. A fork
# pull request cannot reach a secret in a workflow it cannot trigger, so
# confining the token to a dispatch-only workflow is what makes the token safe
# in a public repository. Adding `pull_request`, `push` or `schedule` here would
# undo that in a single line -- so if a timer is ever wanted, put it in its own
# workflow and leave this one unreachable from an event.
#
# It is also why the scan degrades independently: the scan workflow does not
# reference this one, so triage being broken, unfunded or unrun never stops a
# finding from being published (tasks.md 4.9).
on:
  workflow_dispatch:
    inputs:
      report:
        description: >-
          Trivy report to triage. Empty runs a live scan; the default replays
          the committed baseline, which is what makes a run reproducible.
        required: false
        default: '../fixtures/baseline-scan.json'

# Propose-only, and the default for every job here. `security-events` is absent
# deliberately -- the taskflow gives its agent no toolboxes, so it cannot reach
# alert state, and this permissions block means the job could not either. No job
# in this workflow may write alert state; a verdict travels as an issue instead
# (design.md - Decision 4).
#
# The `file-issues` job below widens this to `issues: write`, and to
# `security-events: read` so it can resolve each finding's alert number
# (CONTEXT.md - Tracker item). The split is the point: the job that runs the
# model cannot open an issue or read alert state, and the job that opens
# issues does not run a model and does not see the token.
permissions:
  contents: read

concurrency:
  # Never two triage runs at once: they would spend inference twice on one
  # corpus and race over the same verdict artifact.
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage eligible findings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run triage taskflow
        working-directory: security/iac_security/taskflow
        env:
          AI_API_TOKEN: ${{ secrets.AI_API_TOKEN }}
        run: |
          ./run.sh -g report='${{ inputs.report }}'

      - name: Collect verdicts
        # The run above fails if inference is unavailable. Collect whatever it
        # produced anyway: a partial run's verdicts are still worth having, and
        # a finding with no verdict is recorded as undetermined rather than
        # silently dropped.
        #
        # continue-on-error because a run that failed *before* the model step
        # has no verdicts at all, and collect_verdicts.py refuses to write a
        # file in that case rather than reporting an empty run as a completed
        # one. The job's failure is the one above; this step should not add a
        # second, more confusing one.
        if: always()
        continue-on-error: true
        working-directory: security/iac_security/taskflow
        run: |
          ./scan.sh > /tmp/findings.json
          python3 collect_verdicts.py --latest \
            --findings /tmp/findings.json \
            -o "../runs/${{ github.run_id }}.json"
        env:
          TRIVY_REPORT: ${{ inputs.report }}

      - name: Upload verdicts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: triage-verdicts-${{ github.run_id }}
          path: security/iac_security/runs/
          if-no-files-found: warn

      - name: Upload findings
        # The partition the verdicts were formed over. `file-issues` needs it to
        # decide what may be filed at all, and re-deriving it there could
        # disagree with what was triaged if the working tree moved underneath.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: triage-findings-${{ github.run_id }}
          path: /tmp/findings.json
          if-no-files-found: warn

  file-issues:
    name: File an issue per triaged finding
    needs: triage
    # A run that produced no verdicts uploads nothing, and this job then has
    # nothing to file. `always()` so that a *partial* run still files what it
    # managed to triage: a finding with no verdict is left untriaged, which is
    # the degradation tasks.md 4.7 asks for, not a reason to withhold the rest.
    if: always()
    runs-on: ubuntu-latest
    # The only widened permissions in this workflow, and both are scoped to the
    # job that cannot reach a model or a secret. `security-events: read` is for
    # resolving a finding's alert number, never for writing alert state -- a
    # `not-applicable` verdict still files an issue and leaves the alert open
    # until its rule earns dismissal (design.md - Decision 6).
    permissions:
      contents: read
      issues: write
      security-events: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verdicts
        id: verdicts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: triage-verdicts-${{ github.run_id }}
          path: /tmp/verdicts

      - name: Download findings
        if: steps.verdicts.outcome == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: triage-findings-${{ github.run_id }}
          path: /tmp/findings

      - name: File issues
        if: steps.verdicts.outcome == 'success'
        working-directory: security/iac_security
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verdicts="$(ls /tmp/verdicts/*.json | head -1)"
          [ -n "$verdicts" ] || { echo 'no verdicts to file'; exit 0; }
          python3 file_issues.py \
            --findings /tmp/findings/findings.json \
            --verdicts "$verdicts"
