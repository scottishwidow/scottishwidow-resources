name: 'IaC security triage'

on:
  workflow_dispatch:
    inputs:
      report:
        description: >-
          Trivy report to triage. Empty runs a live scan; the default replays
          the committed baseline, which is what makes a run reproducible.
        required: false
        default: '../fixtures/baseline-scan.json'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage eligible findings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run triage taskflow
        working-directory: security/iac_security/taskflow
        env:
          AI_API_TOKEN: ${{ secrets.AI_API_TOKEN }}
        run: |
          ./run.sh -g report='${{ inputs.report }}'

      - name: Collect verdicts
        if: always()
        continue-on-error: true
        working-directory: security/iac_security/taskflow
        run: |
          ./scan.sh > /tmp/findings.json
          python3 collect_verdicts.py --latest \
            --findings /tmp/findings.json \
            -o "../runs/${{ github.run_id }}.json"
        env:
          TRIVY_REPORT: ${{ inputs.report }}

      - name: Upload verdicts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: triage-verdicts-${{ github.run_id }}
          path: security/iac_security/runs/
          if-no-files-found: warn

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: triage-findings-${{ github.run_id }}
          path: /tmp/findings.json
          if-no-files-found: warn

  file-issues:
    name: File an issue per triaged finding
    needs: triage
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      security-events: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verdicts
        id: verdicts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: triage-verdicts-${{ github.run_id }}
          path: /tmp/verdicts

      - name: Download findings
        if: steps.verdicts.outcome == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: triage-findings-${{ github.run_id }}
          path: /tmp/findings

      - name: File issues
        if: steps.verdicts.outcome == 'success'
        working-directory: security/iac_security
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verdicts="$(ls /tmp/verdicts/*.json | head -1)"
          [ -n "$verdicts" ] || { echo 'no verdicts to file'; exit 0; }
          python3 file_issues.py \
            --findings /tmp/findings/findings.json \
            --verdicts "$verdicts"
