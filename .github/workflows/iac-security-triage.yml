name: 'IaC security triage'

on:
  workflow_run:
    workflows: ['IaC security scan']
    types:
      - completed
  # The manual path, and the only one that may re-triage a finding the tracker
  # already holds. Both inputs default to the cautious answer, so a dispatch with
  # nothing changed costs tokens and artifacts and leaves the tracker alone.
  workflow_dispatch:
    inputs:
      retriage_tracked:
        description: 'Triage every eligible finding, including those that already have an issue'
        type: boolean
        default: false
      file_issues:
        description: 'File the verdicts as issues (a dispatched run files nothing by default)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  triage:
    name: Triage eligible findings
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read the tracker, never to write it: the exclusion needs to know which
      # findings already have an issue, and this job may not open one.
      issues: read
    # This handler holds the secrets, and the scan it watches also runs on fork pull
    # requests. A dispatch is not reached by that path at all -- it needs write access
    # to the repository, which a fork's contributor does not have.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'
      )
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Prepare the runs directory
        # Gitignored scratch state, so a fresh checkout has no `runs/` for Trivy to write into.
        run: mkdir -p security/iac_security/runs

      - name: Vendor the upstream modules
        # Until `init` puts them under `.terraform/modules/`, Trivy reports upstream
        # modules at their source path and `normalise.py` reads them as first-party.
        # A red step, or the warning below, is how a degraded run announces itself.
        continue-on-error: true
        working-directory: live/management
        run: |
          terraform init -backend=false -input=false -no-color
          test -d .terraform/modules ||
            echo '::warning::Upstream modules are not vendored; their findings triage as first-party.'

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'json'
          output: 'security/iac_security/runs/trivy-report.json'
          exit-code: '0'
          version: 'v0.74.0'

      - name: Read the tracker
        # Read on the host, where `gh` and a token are: the published image carries
        # neither, and the taskflow reaches no network of its own.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state all --limit 500 --json number,state,body,comments \
            > security/iac_security/runs/tracker.json

      - name: Run triage taskflow
        working-directory: security/iac_security/taskflow
        env:
          AI_API_TOKEN: ${{ secrets.AI_API_TOKEN }}
          BYPASS: ${{ github.event_name == 'workflow_dispatch' && inputs.retriage_tracked }}
        run: |
          ./run.sh -g report=security/iac_security/runs/trivy-report.json \
            -g tracker=security/iac_security/runs/tracker.json \
            -g bypass="$BYPASS"

      - name: Collect verdicts
        if: always()
        continue-on-error: true
        working-directory: security/iac_security/taskflow
        env:
          TRIVY_REPORT: ../runs/trivy-report.json
        run: |
          ./scan.sh > /tmp/findings.json
          python3 collect_verdicts.py --latest \
            --findings /tmp/findings.json \
            -o "../runs/${{ github.run_id }}.json"

      - name: Upload verdicts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: triage-verdicts-${{ github.run_id }}
          path: security/iac_security/runs/${{ github.run_id }}.json
          if-no-files-found: warn

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: triage-findings-${{ github.run_id }}
          path: /tmp/findings.json
          if-no-files-found: warn

  file-issues:
    name: File an issue per triaged finding
    needs: triage
    # A failed triage attempt still has verdicts to file; a job the condition above held back has none.
    # `!cancelled()` is what displaces the implicit `success()` a job condition carries without one.
    if: ${{ !cancelled() && needs.triage.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      security-events: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Download verdicts
        id: verdicts
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: triage-verdicts-${{ github.run_id }}
          path: /tmp/verdicts

      - name: Download findings
        if: steps.verdicts.outcome == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: triage-findings-${{ github.run_id }}
          path: /tmp/findings

      - name: File issues
        if: steps.verdicts.outcome == 'success'
        working-directory: security/iac_security
        env:
          GH_TOKEN: ${{ github.token }}
          # A dispatched run decides everything and files nothing unless asked, so
          # testing verdicts costs tokens and artifacts but no tracker churn.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.file_issues != true }}
        run: |
          verdicts=/tmp/verdicts/${{ github.run_id }}.json
          [ -f "$verdicts" ] || { echo 'no verdicts to file'; exit 0; }
          filing=()
          if [ "$DRY_RUN" = 'true' ]; then
            filing+=(--dry-run)
          fi
          python3 file_issues.py \
            --findings /tmp/findings/findings.json \
            --verdicts "$verdicts" "${filing[@]}"
