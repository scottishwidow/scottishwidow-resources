name: 'IaC security scan'

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy config scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scan never touches a git remote; do not leave a token on disk.
          persist-credentials: false

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          # Pinned so the scanner moves deliberately with the baseline fixture
          # in security/iac-security-triage/fixtures/ rather than drifting with
          # the action's own default.
          version: 'v0.74.0'

      - name: Upload SARIF to code scanning
        if: always()
        # On a pull request from a fork the GITHUB_TOKEN is read-only regardless
        # of the permissions block above, so the upload may be rejected. Findings
        # still appear in the job log; the run must not fail.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: 'trivy-results.sarif'
