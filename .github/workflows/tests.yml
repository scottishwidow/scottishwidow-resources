name: 'Tests'

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unittest:
    name: Run the unittest suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install the one test dependency
        # `test_workflows.py` and `test_taskflow.py` read the YAML files they assert about.
        run: python3 -m pip install pyyaml

      - name: Run the triage suite
        run: python3 -m unittest discover -s security/iac_security/tests

      - name: Run the taskflow suite
        run: python3 -m unittest discover -s security/iac_security/taskflow/tests
