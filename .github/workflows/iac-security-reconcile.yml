name: 'IaC security reconciliation'

on:
  # The close is the event; the `wontfix` label is what the decision is keyed on,
  # and the job condition below reads it.
  issues:
    types:
      - closed

permissions:
  contents: read

# Per issue, so two issues closed at once are reconciled independently and neither
# cancels the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dismiss:
    name: Dismiss the alert of an issue closed wontfix
    # A close carrying no `wontfix` costs a skipped job and no permission at all.
    if: contains(github.event.issue.labels.*.name, 'wontfix')
    runs-on: ubuntu-latest
    # The only grant of `security-events: write` outside the scan's SARIF publish,
    # and the only place in this repository that writes alert state. It runs no
    # model and holds no token of that kind: what it carries is a human's decision.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Read the closed issue
        # Off the event payload rather than interpolated into a script: an issue
        # body is written by whoever opened the issue.
        run: jq '.issue' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/issue.json"

      - name: Dismiss the alert the issue names
        working-directory: security/iac_security
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 reconcile_alert.py --issue "$RUNNER_TEMP/issue.json"
