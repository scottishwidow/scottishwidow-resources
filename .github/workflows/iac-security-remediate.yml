name: 'IaC security remediation'

on:
  # A dedicated label, filtered in the job condition below. `ready-for-agent` is
  # the repository's general AFK-ready label under `docs/agents/triage-labels.md`
  # and is carried by issues that hold no finding, so triggering on it would
  # start a run for every issue marked ready for an agent.
  issues:
    types:
      - labeled

permissions:
  contents: read

# Per issue, so two issues labelled at once are remediated independently and
# neither cancels the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  target:
    name: Read the finding key off the labelled issue
    if: github.event.label.name == 'ready-for-remediation'
    runs-on: ubuntu-latest
    # Deterministic, and holds no token of either kind: the issue body arrives in
    # the event payload, so a mislabelled issue is answered without reading or
    # running anything. This is what makes a mislabelled issue cost nothing.
    permissions:
      contents: read
    outputs:
      key: ${{ steps.finding.outputs.key }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Read the finding key
        id: finding
        working-directory: security/iac_security
        # Through the environment, never interpolated into the script: an issue
        # body is written by whoever opened the issue.
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          key="$(python3 remediation_target.py --key-only)"
          if [ -z "$key" ]; then
            echo '::notice::this issue carries no finding key; there is nothing to remediate'
          fi
          echo "key=$key" >> "$GITHUB_OUTPUT"

  remediate:
    name: Derive a patch for the finding
    needs: target
    if: needs.target.outputs.key != ''
    runs-on: ubuntu-latest
    # This job holds the model token, so it holds no write permission of any
    # kind. The patch it produces is text; every write of it happens elsewhere.
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Prepare the runs directory
        # Gitignored scratch state, so a fresh checkout has no `runs/` for Trivy to write into.
        run: mkdir -p security/iac_security/runs

      - name: Install Terraform
        # `ubuntu-latest` carries no Terraform, and without it the vendoring
        # step below cannot run at all.
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Vendor the upstream modules
        # Until `init` puts them under `.terraform/modules/`, Trivy reports upstream
        # modules at their source path and `normalise.py` reads them as first-party.
        continue-on-error: true
        working-directory: live/management
        run: |
          terraform init -backend=false -input=false -no-color
          test -d .terraform/modules ||
            echo '::warning::Upstream modules are not vendored; their findings triage as first-party.'

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'json'
          output: 'security/iac_security/runs/trivy-report.json'
          exit-code: '0'
          version: 'v0.74.0'

      - name: Read the tracker item
        # Read on the host, where `gh` and a token are: the published image carries
        # neither, and the taskflow reaches no network of its own.
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh issue view "$ISSUE" --json number,body,comments \
            > security/iac_security/runs/issue.json

      - name: Read the remediation target
        # The same assembly the taskflow's own first task runs, repeated on the
        # host because the gate needs the finding record and the container
        # writes nothing out. Before the model, so a finding the scan no longer
        # holds stops the run rather than being paid for.
        working-directory: security/iac_security
        env:
          TRIVY_REPORT: runs/trivy-report.json
        run: |
          taskflow/scan.sh |
            python3 remediation_target.py --issue runs/issue.json -o runs/target.json

      - name: Run remediation taskflow
        working-directory: security/iac_security/taskflow
        env:
          AI_API_TOKEN: ${{ secrets.AI_API_TOKEN }}
          TASKFLOW: security.iac_security.taskflow.taskflows.iac_remediate
        run: |
          ./run.sh -g report=security/iac_security/runs/trivy-report.json \
            -g issue=security/iac_security/runs/issue.json

      - name: Collect the patch
        working-directory: security/iac_security/taskflow
        run: |
          python3 collect_patch.py --latest -o "../runs/${{ github.run_id }}.patch"

      - name: Upload the patch
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remediation-patch-${{ github.run_id }}
          path: security/iac_security/runs/${{ github.run_id }}.patch
          if-no-files-found: warn

      - name: Upload the evidence the gate decides on
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remediation-evidence-${{ github.run_id }}
          path: |
            security/iac_security/runs/target.json
            security/iac_security/runs/trivy-report.json
          if-no-files-found: warn

  gate:
    name: Decide whether the patch reaches review
    needs:
      - target
      - remediate
    runs-on: ubuntu-latest
    # It applies a model-authored diff to the tree it works in, so it holds
    # nothing to write with and no token of either kind.
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.decision.outputs.passed }}
      gate: ${{ steps.decision.outputs.gate }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Download the patch and the evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # Outside the working tree, because the tree is re-scanned: a JSON
          # report left in it would be scanned as if it were repository content.
          path: ${{ runner.temp }}/remediation
          pattern: remediation-*-${{ github.run_id }}
          merge-multiple: true

      - name: Apply the patch
        # From the repository root, because `git apply` reads the diff's paths
        # relative to the working directory rather than to the root.
        id: apply
        run: |
          if git apply --whitespace=nowarn "$PATCH"; then
            echo 'applies=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::the patch does not apply cleanly'
            echo 'applies=false' >> "$GITHUB_OUTPUT"
          fi
        env:
          PATCH: ${{ runner.temp }}/remediation/${{ github.run_id }}.patch

      - name: Check the formatting of the files the patch touched
        id: fmt
        if: steps.apply.outputs.applies == 'true'
        # Per touched file rather than per directory: the gate judges the patch,
        # and a directory check would fail on formatting that predates it.
        env:
          PATCH: ${{ runner.temp }}/remediation/${{ github.run_id }}.patch
        run: |
          passed=true
          for file in $(git apply --numstat "$PATCH" | cut -f3 | grep '\.tf$' || true); do
            terraform fmt -check -no-color "$file" || passed=false
          done
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

      - name: Validate the patched Terraform
        id: validate
        if: steps.apply.outputs.applies == 'true'
        # Every root module under `live/`, and the init that vendors the upstream
        # modules the re-scan must read as vendored. An init that cannot reach the
        # registry fails the gate: a patch this job cannot judge does not pass it.
        run: |
          passed=true
          for dir in $(find live -name '*.tf' -printf '%h\n' | sort -u); do
            terraform -chdir="$dir" init -backend=false -input=false -no-color > /dev/null ||
              { passed=false; continue; }
            terraform -chdir="$dir" validate -no-color || passed=false
          done
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

      - name: Re-scan the patched tree
        if: steps.apply.outputs.applies == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'json'
          output: '${{ runner.temp }}/remediation/post-scan.json'
          exit-code: '0'
          version: 'v0.74.0'

      - name: Decide
        id: decision
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/remediation
          APPLIES: ${{ steps.apply.outputs.applies }}
          VALIDATE_PASSED: ${{ steps.validate.outputs.passed }}
          FMT_PASSED: ${{ steps.fmt.outputs.passed }}
        # A skipped step leaves its output empty, and an outcome nobody observed
        # is not a pass.
        run: |
          jq -n \
            --argjson applies "${APPLIES:-false}" \
            --argjson validate_passed "${VALIDATE_PASSED:-false}" \
            --argjson fmt_passed "${FMT_PASSED:-false}" \
            '{applies: $applies, validate_passed: $validate_passed, fmt_passed: $fmt_passed}' \
            > "$EVIDENCE_DIR/evidence.json"
          post_scan=''
          if [ -f "$EVIDENCE_DIR/post-scan.json" ]; then
            post_scan="--post-scan=$EVIDENCE_DIR/post-scan.json"
          fi
          python3 security/iac_security/patch_gate.py \
            --diff "$EVIDENCE_DIR/${{ github.run_id }}.patch" \
            --target "$EVIDENCE_DIR/target.json" \
            --pre-scan "$EVIDENCE_DIR/trivy-report.json" \
            $post_scan \
            --evidence "$EVIDENCE_DIR/evidence.json" \
            -o "$EVIDENCE_DIR/decision.json"
          {
            echo "passed=$(jq -r .passed "$EVIDENCE_DIR/decision.json")"
            echo "gate=$(jq -r .gate "$EVIDENCE_DIR/decision.json")"
            echo 'reason<<GATE_REASON'
            jq -r .reason "$EVIDENCE_DIR/decision.json"
            echo 'GATE_REASON'
          } >> "$GITHUB_OUTPUT"

      - name: Upload the decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remediation-decision-${{ github.run_id }}
          path: ${{ runner.temp }}/remediation/decision.json
          if-no-files-found: warn

  pull-request:
    name: Open a pull request for the accepted patch
    needs:
      - target
      - remediate
      - gate
    if: needs.gate.outputs.passed == 'true'
    runs-on: ubuntu-latest
    # It writes, so it holds no `AI_API_TOKEN` and runs no model. What it pushes
    # was decided by the gate; this job forms no judgment of its own.
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # The push credential is supplied to the one command that pushes, so
          # the tree a model-authored diff is applied in never holds one.
          persist-credentials: false

      - name: Download the patch and the evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # Outside the working tree, so nothing downloaded is committed.
          path: ${{ runner.temp }}/remediation
          pattern: remediation-*-${{ github.run_id }}
          merge-multiple: true

      - name: Commit the patch to a branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          EVIDENCE_DIR: ${{ runner.temp }}/remediation
        run: |
          branch="remediation/issue-${ISSUE}-${{ github.run_id }}"
          key="$(jq -r .finding.key "$EVIDENCE_DIR/target.json")"
          git switch -c "$branch"
          git apply --whitespace=nowarn "$EVIDENCE_DIR/${{ github.run_id }}.patch"
          git add --all
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "fix(security): remediate ${key}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${branch}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          KEY: ${{ steps.branch.outputs.key }}
          GATE_REASON: ${{ needs.gate.outputs.reason }}
          EVIDENCE_DIR: ${{ runner.temp }}/remediation
        run: |
          verdict="$(jq -r .issue.verdict "$EVIDENCE_DIR/target.json")"
          rationale="$(jq -r '.issue.rationale // ""' "$EVIDENCE_DIR/target.json")"
          cat > "$EVIDENCE_DIR/body.md" <<BODY
          A patch for \`${KEY}\`, proposed by the remediation pipeline and passed by
          the patch gate.

          - **Finding key**: \`${KEY}\`
          - **Verdict**: \`${verdict}\`
          - **Rationale**: ${rationale}
          - **Gate**: ${GATE_REASON}

          The patch gate is a filter, not an acceptance. It confirms that the diff
          applies, touches only the paths the finding named, holds
          \`terraform validate\` and \`terraform fmt -check\`, removes the finding key
          and introduces no new one. It cannot see that a patch stranded a subnet's
          instances. **Your merge is what accepts this patch.**

          Closes #${ISSUE}
          BODY
          gh pr create \
            --base main \
            --head "${{ steps.branch.outputs.name }}" \
            --title "fix(security): remediate ${KEY}" \
            --body-file "$EVIDENCE_DIR/body.md"

  report-rejection:
    name: Say on the issue which gate the patch failed
    needs:
      - target
      - remediate
      - gate
    if: needs.gate.outputs.passed == 'false'
    runs-on: ubuntu-latest
    # It writes, so it holds no `AI_API_TOKEN` and runs no model. It opens no
    # pull request either: a rejected patch reaches the repository nowhere.
    permissions:
      issues: write
    steps:
      - name: Comment the gate the patch failed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          GATE: ${{ needs.gate.outputs.gate }}
          GATE_REASON: ${{ needs.gate.outputs.reason }}
        run: |
          cat > "$RUNNER_TEMP/comment.md" <<BODY
          The remediation pipeline derived a patch for this finding and the patch
          gate rejected it at the \`${GATE}\` gate: ${GATE_REASON}

          No pull request was opened, and nothing was written to the repository.
          The patch is on the run as the \`remediation-patch-${{ github.run_id }}\`
          artifact. Removing and re-applying the \`ready-for-remediation\` label starts
          a new run.
          BODY
          gh issue comment "$ISSUE" --body-file "$RUNNER_TEMP/comment.md"
